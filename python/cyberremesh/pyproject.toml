[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberremesh"
version = "0.7.0"
description = "Python bindings for the CyberRemesher quad-remeshing engine (ctypes over the C ABI)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Cyberdyne Corp" }]
keywords = ["retopology", "remeshing", "quad", "uv", "ctypes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
numpy = ["numpy>=1.20"]

[tool.setuptools]
packages = ["cyberremesh"]

# The wheel is not pure Python: `packaging/publish/stage_native_lib.py` copies the
# freshly built C ABI shared library into the package directory before the wheel is
# built, and `_ffi.find_library_path` looks for it there first. Without this glob
# setuptools silently drops the library and emits a `py3-none-any` wheel that can
# import but never run (and that cibuildwheel then rejects). setup.py forces the
# platform tag so auditwheel/delocate/cibuildwheel see a binary wheel.
[tool.setuptools.package-data]
cyberremesh = ["*.so", "*.so.*", "*.dylib", "*.dll", "*.pyd"]
